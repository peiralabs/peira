name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: analyze, test, marker scan
    # Pinned image, not ubuntu-latest: reproducible glibc/fontconfig floor.
    # ubuntu-22.04 starts deprecation 2026-09-17 — do not move back to it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in lockstep with the maintainer/release Flutter version.
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Golden-tagged tests (screenshots, app icon) are exact-pixel PNGs from
      # the maintainer machine's fontconfig — inspection artifacts, not
      # regression gates. A runner renders text differently, so every one of
      # them would fail here; they stay a local pre-commit discipline.
      - run: flutter test --exclude-tags golden

      # Fails closed on any private-marker regression (IPs, hostnames,
      # credentials, unattested binaries). See tool/check_public_markers.dart.
      - run: dart tool/check_public_markers.dart
