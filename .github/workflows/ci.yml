name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: analyze, test, marker scan
    # Pinned image, not ubuntu-latest: reproducible glibc/fontconfig floor.
    # ubuntu-22.04 starts deprecation 2026-09-17 — do not move back to it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in lockstep with the maintainer/release Flutter version.
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Behaviour tests only; the visual goldens run in the dedicated `goldens`
      # job below (alchemist CI goldens are machine-independent, so they ARE a
      # real regression gate now — see test/flutter_test_config.dart).
      - run: flutter test --exclude-tags golden

      # Fails closed on any private-marker regression (IPs, hostnames,
      # credentials, unattested binaries). See tool/check_public_markers.dart.
      - run: dart tool/check_public_markers.dart

  goldens:
    name: visual goldens
    # ADVISORY for now: alchemist's CI goldens remove most machine dependence,
    # but a small runner-vs-maintainer-laptop rendering delta remains, so
    # baselines generated off-runner don't match exactly. The golden step is
    # `continue-on-error` so this check stays GREEN while still uploading the
    # diff artifact for review. To make it a HARD gate: once update-goldens.yml
    # is on the default branch, run it once to regenerate baselines ON this
    # runner (it re-attests the binaries too), then drop the step's
    # continue-on-error below.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - run: flutter test --tags golden
        continue-on-error: true

      # Publish the failure images (expected / actual / masked diff that
      # alchemist writes) for review. always() because the step above is
      # continue-on-error, so the job stays green either way.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: '**/failures/**'
          if-no-files-found: ignore
          retention-days: 14
