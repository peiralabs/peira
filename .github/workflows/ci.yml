name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: analyze, test, marker scan
    # Pinned image, not ubuntu-latest: reproducible glibc/fontconfig floor.
    # ubuntu-22.04 starts deprecation 2026-09-17 — do not move back to it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Keep in lockstep with the maintainer/release Flutter version.
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Behaviour tests only; the visual goldens run in the dedicated `goldens`
      # job below (alchemist CI goldens are machine-independent, so they ARE a
      # real regression gate now — see test/flutter_test_config.dart).
      - run: flutter test --exclude-tags golden

      # Fails closed on any private-marker regression (IPs, hostnames,
      # credentials, unattested binaries). See tool/check_public_markers.dart.
      - run: dart tool/check_public_markers.dart

  goldens:
    name: visual goldens
    # ADVISORY for now (continue-on-error): alchemist's CI goldens remove most
    # machine dependence, but a small runner-vs-maintainer-laptop rendering
    # delta remains, so baselines generated off-runner don't match exactly.
    # To make this a HARD gate: once `update-goldens.yml` is on the default
    # branch it becomes dispatchable — run it once to regenerate the baselines
    # ON this runner (it also re-attests the binaries), then drop
    # `continue-on-error` here.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - run: flutter test --tags golden

      # On a pixel diff, publish the failure images (expected / actual / masked
      # diff that alchemist writes) so the change is reviewable from the PR.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: '**/failures/**'
          if-no-files-found: ignore
          retention-days: 14
