name: Release

# Two ways to cut a release, both producing a signed GitHub Release carrying
# the AppImage, SHA256SUMS, and detached GPG signatures:
#   * push a tag:  `git tag v1.2.3 && git push --tags`
#   * manual run:  the "Release" workflow's "Run workflow" button, which tags
#     the current commit from pubspec's version and publishes. Use this when
#     tag pushes from a personal token are restricted — the Actions bot does
#     the tagging.
#
# Required repository secrets:
#   GPG_PRIVATE_KEY   ASCII-armored signing key (gpg --armor --export-secret-keys)
#   GPG_PASSPHRASE    its passphrase
#
# Keep the build steps in lockstep with build.yml (same base, deps, pins).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # The version being released. On a tag push the tag is authoritative and
      # must match pubspec; on a manual run pubspec is authoritative and names
      # the tag.
      - name: Resolve release version
        run: |
          pv=$(grep -oP '^version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml)
          if [ '${{ github.event_name }}' = 'push' ]; then
            v='${{ github.ref_name }}'
            [ "$v" = "v$pv" ] || { echo "tag $v != pubspec v$pv" >&2; exit 1; }
          else
            v="v$pv"
          fi
          echo "RELEASE_VERSION=$v" >> "$GITHUB_ENV"
          # Version-stamped asset name so each release's download is distinct.
          echo "APPIMAGE_NAME=Peira-$v-x86_64.AppImage" >> "$GITHUB_ENV"

      # Manual runs create the tag here, as the Actions bot, so a release can
      # be cut even where tag pushes from personal tokens are restricted.
      # Idempotent: a pre-existing tag (e.g. from an earlier failed run) is
      # left in place so the run can re-publish against it.
      - name: Tag this commit (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "tag $RELEASE_VERSION already exists on origin; continuing"
          else
            git tag -a "$RELEASE_VERSION" -m "Peira ${RELEASE_VERSION#v}"
            git push origin "$RELEASE_VERSION"
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libxi-dev libsecret-1-dev \
            libnss3 libasound2t64 libcups2t64

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Keep in lockstep with .tool-versions, ci.yml, and build.yml.
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - name: Compute CEF cache key
        id: cef
        run: |
          f=$(find ~/.pub-cache -path '*webview_cef*/third/download.cmake' | head -1)
          [ -n "$f" ] || { echo "webview_cef download.cmake not found" >&2; exit 1; }
          echo "version=$(grep -oP 'set\(CEF_VERSION "\K[^"]+' "$f")" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$f")/cef" >> "$GITHUB_OUTPUT"

      - name: Cache CEF
        uses: actions/cache@v5
        with:
          path: ${{ steps.cef.outputs.dir }}
          key: cef-linux64-${{ steps.cef.outputs.version }}

      - run: flutter analyze

      - run: flutter test --exclude-tags golden

      - run: dart tool/check_public_markers.dart

      - run: flutter build linux --release

      - run: bash tool/build_appimage.sh "dist/$APPIMAGE_NAME"

      - name: Checksums
        working-directory: dist
        run: sha256sum "$APPIMAGE_NAME" > SHA256SUMS

      - name: Sign
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          for f in "$APPIMAGE_NAME" SHA256SUMS; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" --detach-sign --armor "$f"
          done

      # Idempotent publish: create the release, or upload (clobbering) if a
      # release for this tag already exists, so a re-run repairs a partial one.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "dist/$APPIMAGE_NAME"
            "dist/$APPIMAGE_NAME.asc"
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
          )
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" --clobber "${assets[@]}"
          else
            gh release create "$RELEASE_VERSION" \
              --title "$RELEASE_VERSION" \
              --notes 'See CHANGELOG.md. Verify: `sha256sum -c SHA256SUMS` and `gpg --verify SHA256SUMS.asc SHA256SUMS`.' \
              "${assets[@]}"
          fi
