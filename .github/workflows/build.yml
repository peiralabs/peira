name: Build AppImage

# Manual trigger only: PR CI (ci.yml) stays fast, and release automation on
# tags is its own workflow. Re-verify action majors when this first runs on
# a real repository.
#
# Produces a uniquely-named artifact — Peira-v<version>-<flavor>-<shortsha>-
# x86_64.AppImage — so repeated test builds don't collide in Downloads and the
# flavor (e.g. wayland) is spelled out, distinct from the X11 release asset.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build label baked into the filename (e.g. wayland, x11, dev)'
        required: false
        default: 'dev'

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Without libsecret-1-dev flutter_secure_storage fails to link;
      # libxi-dev supplies the X client libraries the AppImage bundles.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libxi-dev libsecret-1-dev

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          # Keep in lockstep with ci.yml and the maintainer machine.
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - name: Compute artifact name
        id: name
        run: |
          pv=$(grep -oP '^version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' pubspec.yaml)
          echo "file=Peira-v${pv}-${{ inputs.flavor }}-${GITHUB_SHA::7}-x86_64.AppImage" \
            >> "$GITHUB_OUTPUT"

      - run: flutter build linux --release

      - run: bash tool/build_appimage.sh "dist/${{ steps.name.outputs.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: dist/${{ steps.name.outputs.file }}
          if-no-files-found: error
